<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Kitchen: The Server Chef</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --neon-red: #ff3333;
            --dark-bg: #0a0a12;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            user-select: none;
        }

        /* 3D Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* Main UI Container */
        #game-ui {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Header / HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 20px;
        }

        .hud-box {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            box-shadow: 0 0 15px var(--neon-blue) inset;
        }

        /* Main Gameplay Area */
        #kitchen-area {
            display: flex;
            flex: 1;
            gap: 30px;
            align-items: center;
            justify-content: center;
        }

        /* The "Order Ticket" (JSON Viewer) */
        .ticket-station {
            flex: 1;
            max-width: 500px;
            perspective: 1000px;
        }

        .ticket {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink);
            border-radius: 15px;
            padding: 25px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            font-size: 1.2rem;
            color: #fff;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            animation: floatTicket 3s infinite ease-in-out;
        }

        @keyframes floatTicket {
            0%, 100% { transform: translateY(0px) rotateX(5deg); }
            50% { transform: translateY(-15px) rotateX(5deg); }
        }

        .ticket h2 { margin-top: 0; color: var(--neon-pink); text-align: center;}
        .json-key { color: var(--neon-blue); }
        .json-string { color: var(--neon-green); }
        .json-number { color: orange; }

        /* The Controls (Response Buttons) */
        .controls-station {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn:active { transform: scale(0.95); }

        .btn-200 {
            background: rgba(0, 255, 136, 0.2);
            border: 3px solid var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
        }
        .btn-200:hover { background: var(--neon-green); color: black; }

        .btn-400 {
            background: rgba(255, 165, 0, 0.2);
            border: 3px solid orange;
            color: orange;
            box-shadow: 0 0 20px orange;
        }
        .btn-400:hover { background: orange; color: black; }

        .btn-404 {
            background: rgba(255, 51, 51, 0.2);
            border: 3px solid var(--neon-red);
            color: var(--neon-red);
            box-shadow: 0 0 20px var(--neon-red);
        }
        .btn-404:hover { background: var(--neon-red); color: white; }

        /* The Menu Database (Reference) */
        #menu-reference {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid var(--neon-blue);
            padding: 15px;
            border-radius: 10px;
        }
        #menu-reference h3 { margin: 0 0 10px 0; color: var(--neon-blue); }
        #menu-list li { margin-bottom: 5px; font-family: monospace; color: #aaa; }

        /* Feedback Overlay */
        #feedback-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #start-screen {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: rgba(10,10,18,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        #start-screen h1 { font-size: 4rem; color: var(--neon-blue); text-shadow: 0 0 30px var(--neon-pink); margin-bottom: 10px;}
        #start-button { padding: 20px 40px; font-size: 2rem; background: var(--neon-pink); border: none; color: white; border-radius: 50px; cursor: pointer; box-shadow: 0 0 30px var(--neon-pink);}
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="feedback-overlay"></div>

    <div id="start-screen">
        <h1>API KITCHEN</h1>
        <p style="font-size: 1.5rem; margin-bottom: 40px;">Be the Server. Process the JSON Orders.</p>
        <button id="start-button" onclick="startGame()">OPEN RESTAURANT</button>
    </div>

    <div id="game-ui" style="display:none;">
        <div id="hud">
            <div class="hud-box">Cash: $<span id="score">0</span></div>
            <div class="hud-box">Level: <span id="level">1</span></div>
        </div>

        <div id="kitchen-area">
            <div class="ticket-station">
                <div class="ticket" id="ticket-display">
                    <h2>INCOMING REQUEST...</h2>
                    <div id="json-content">Waiting for orders...</div>
                </div>
            </div>

            <div class="controls-station">
                <button class="btn btn-200" onclick="processOrder(200)">
                    COOK & SERVE<br><small>(200 OK)</small>
                </button>
                <button class="btn btn-404" onclick="processOrder(404)">
                    DISH NOT FOUND<br><small>(404 Not Found)</small>
                </button>
                <button class="btn btn-400" onclick="processOrder(400)">
                    BAD DATA FORMAT<br><small>(400 Bad Request)</small>
                </button>
            </div>
        </div>

        <div id="menu-reference">
            <h3>DATABASE (MENU)</h3>
            <ul id="menu-list">
                </ul>
        </div>
    </div>

    <script>
        // ===========================
        // GAME STATE & DATABASE
        // ===========================
        let gameState = {
            score: 0,
            level: 1,
            isPlaying: false,
            currentOrder: null,
            ordersProcessed: 0
        };

        // The "Database" - what dishes actually exist
        const MENU_DATABASE = {
            "pizza": { price: 15 },
            "burger": { price: 12 },
            "salad": { price: 10 },
            "pasta": { price: 18 }
        };

        // Populate the on-screen menu reference
        const menuList = document.getElementById('menu-list');
        for(let dish in MENU_DATABASE) {
            let li = document.createElement('li');
            li.textContent = `"${dish}" - $${MENU_DATABASE[dish].price}`;
            menuList.appendChild(li);
        }

        // Simple audio synths for feedback
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if(type === 'success') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.4);
            }
        }


        // ===========================
        // GAME LOGIC: ORDER GENERATION
        // ===========================
        function generateOrder() {
            const dishes = Object.keys(MENU_DATABASE);
            const randomDish = dishes[Math.floor(Math.random() * dishes.length)];
            const badDishes = ["shoes", "unicorn steak", "dark matter", "sand"];
            
            const scenario = Math.random();
            let order = {};
            let expectedStatus = 200;

            if(scenario < 0.5) {
                // Scenario 1: Valid Order (50% chance)
                order = { "dish": randomDish, "quantity": Math.ceil(Math.random() * 3) };
                expectedStatus = 200;
            } else if (scenario < 0.75) {
                // Scenario 2: 404 Not Found (25% chance) - item not in DB
                order = { "dish": badDishes[Math.floor(Math.random() * badDishes.length)], "quantity": 1 };
                expectedStatus = 404;
            } else {
                // Scenario 3: 400 Bad Request (25% chance) - malformed data
                if(Math.random() < 0.5) {
                     // Invalid quantity type (string instead of number)
                    order = { "dish": randomDish, "quantity": "two" };
                } else {
                     // Missing required field
                    order = { "quantity": 5 };
                }
                expectedStatus = 400;
            }

            gameState.currentOrder = { data: order, expected: expectedStatus };
            displayOrder(order);
        }

        function displayOrder(jsonObj) {
            const container = document.getElementById('json-content');
            // Pretty print JSON with colors
            let jsonStr = JSON.stringify(jsonObj, null, 4);
            // Simple syntax highlighting regex
            jsonStr = jsonStr.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key'; // Key ending in :
                    } else {
                        cls = 'json-string'; // String value
                    }
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
            container.innerHTML = jsonStr;

            // Reset ticket animation animation
            const ticket = document.getElementById('ticket-display');
            ticket.style.animation = 'none';
            ticket.offsetHeight; /* trigger reflow */
            ticket.style.animation = null; 
        }


        // ===========================
        // GAME LOGIC: PLAYER ACTION
        // ===========================
        function processOrder(playerSelectedStatus) {
            if(!gameState.isPlaying || !gameState.currentOrder) return;

            const correctStatus = gameState.currentOrder.expected;
            let isCorrect = (playerSelectedStatus === correctStatus);

            if (isCorrect) {
                // Success!
                handleSuccess(playerSelectedStatus);
            } else {
                // Failure!
                handleFailure(playerSelectedStatus, correctStatus);
            }

            // Progression system
            gameState.ordersProcessed++;
            if(gameState.ordersProcessed % 5 === 0) {
                gameState.level++;
                document.getElementById('level').innerText = gameState.level;
                playSound('success'); // Extra beep for level up
            }

            // Load next order after short delay
            gameState.currentOrder = null;
            document.getElementById('json-content').innerHTML = "Processing next order...";
            setTimeout(generateOrder, 1500 - (gameState.level * 100)); // Get faster per level
        }

        function handleSuccess(status) {
            playSound('success');
            flashFeedback('var(--neon-green)');
            
            let earnings = 0;
            if(status === 200) {
                // Calculate bill based on DB price
                const dishName = gameState.currentOrder.data.dish;
                const qty = gameState.currentOrder.data.quantity;
                earnings = MENU_DATABASE[dishName].price * qty;
            } else {
                // Smaller bonus for correctly identifying errors
                earnings = 5;
            }
            gameState.score += earnings;
            updateScore();
        }

        function handleFailure(selected, expected) {
            playSound('error');
            flashFeedback('var(--neon-red)');
            gameState.score = Math.max(0, gameState.score - 10); // Penalty
            updateScore();
            // In a full game, we'd show a "Why you failed" modal here.
            console.log(`Failed. You said ${selected}, but it should have been ${expected}`);
        }

        function updateScore() {
            document.getElementById('score').innerText = gameState.score;
        }

        function flashFeedback(color) {
            const overlay = document.getElementById('feedback-overlay');
            overlay.style.backgroundColor = color;
            overlay.style.opacity = 0.3;
            setTimeout(() => { overlay.style.opacity = 0; }, 300);
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            gameState.isPlaying = true;
            // Initialize audio context on first user interaction
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            generateOrder();
        }


        // ===========================
        // THREE.JS BACKGROUND SETUP
        // ===========================
        const canvas = document.querySelector('#bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0a12);

        const scene = new THREE.Scene();
        // Fog to hide the distance and create depth
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;
        camera.position.y = 2;

        // Add some glowing "Server Racks"
        const geometry = new THREE.BoxGeometry(1, 4, 1);
        for (let i = 0; i < 20; i++) {
            // Random neon colors for racks
            const colors = [0x00f2ff, 0xff00ff, 0x00ff88];
            const randColor = colors[Math.floor(Math.random() * colors.length)];
            
            const material = new THREE.MeshStandardMaterial({
                color: 0x111111,
                emissive: randColor,
                emissiveIntensity: 0.5,
                roughness: 0.2,
                metalness: 0.8
            });
            const cube = new THREE.Mesh(geometry, material);
            
            // Scatter them in the background
            cube.position.x = (Math.random() - 0.5) * 30;
            cube.position.z = -5 - Math.random() * 20;
            cube.position.y = Math.random() * 2;
            scene.add(cube);
        }

        // Add lights
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(0, 10, 10);
        scene.add(light);
        const ambientLight = new THREE.AmbientLight(0x404040); // soft white light
        scene.add(ambientLight);

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.002;
            // Slowly move camera forward through the server room
            camera.position.z -= 0.02;
            camera.position.y = 2 + Math.sin(time)*0.5; // slight bobbing

            // Reset camera if it goes too far
            if(camera.position.z < -10) {
                camera.position.z = 10;
            }
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
